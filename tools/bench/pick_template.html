<!doctype html><html><head><meta charset="utf-8"><title>Pick __TAG__</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d0e12;--fg:#e8e8ee;--mut:#8b91a0;--line:#2a2d36;--acc:#6f93e8}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{font-weight:600}.mut{color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 16px}
.side{display:flex;flex-direction:column;gap:6px}
.side img{width:100%;image-rendering:pixelated;background:#000;border:2px solid transparent;border-radius:4px;cursor:zoom-in}
.side.on img{border-color:var(--acc)}
.bar{display:flex;gap:8px;justify-content:center;padding:4px 16px 14px;flex-wrap:wrap}
button{background:#1a1c23;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 18px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
#inp{height:240px;image-rendering:pixelated;border-radius:4px}
#zoom{position:fixed;inset:0;background:#000;display:none;overflow:auto;cursor:zoom-out}
#zoom img{image-rendering:pixelated;display:block;margin:auto}
textarea{width:100%;height:60px;background:#111;color:var(--fg);border:1px solid var(--line)}
@media(max-width:700px){main{grid-template-columns:1fr}}
</style></head><body>
<header><img id="inp" alt="target"><div><b>Which is more like the artist? (__TAG__)</b><div class="mut">← left · → right · ↓ same / can't tell · click a picture to see it full size · <span id="pos"></span></div></div></header>
<main><div class="side" id="sL"><img id="L" alt="left"></div><div class="side" id="sR"><img id="R" alt="right"></div></main>
<div class="bar"><button data-v="L">← Left</button><button data-v="S">Same</button><button data-v="R">Right →</button><button data-v="back" class="mut">Back</button></div>
<div class="bar"><input id="note" placeholder="optional note on this pair (what's better / worse)" style="flex:1;min-width:240px;background:#111;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px"></div>
<div id="done" style="display:none;padding:16px"><b>All done, thanks.</b> <span class="mut">Claude can read your picks from this page.</span></div>
<div id="zoom"><img id="zi"></div>
<script>
const P=__PAIRS__, K='pick___TAG__'; let st; try{st=JSON.parse(localStorage.getItem(K))||{}}catch(e){st={}}
window.picks=st; let i=P.findIndex(p=>!st[p]); if(i<0)i=P.length;
function save(){window.picks=st;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function show(){const done=i>=P.length; document.getElementById('done').style.display=done?'block':'none';
 if(done){document.getElementById('pos').textContent=P.length+' / '+P.length;return}
 const p=P[i]; for(const s of ['L','R'])document.getElementById(s).src=p+'_'+s+'.png';
 document.getElementById('inp').src=p+'_in.jpg'; document.getElementById('pos').textContent=(i+1)+' / '+P.length;
 document.getElementById('note').value=(st[p]&&st[p].note)||'';}
function pick(v){if(v==='back'){i=Math.max(0,i-1);show();return} if(i>=P.length)return;
 st[P[i]]={v,note:document.getElementById('note').value};save();i++;show();}
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>pick(b.dataset.v));
addEventListener('keydown',e=>{if(e.target.id==='note')return;
 if(e.key==='ArrowLeft')pick('L');else if(e.key==='ArrowRight')pick('R');else if(e.key==='ArrowDown')pick('S');else if(e.key==='Escape')document.getElementById('zoom').style.display='none'});
for(const s of ['L','R'])document.getElementById(s).onclick=e=>{document.getElementById('zi').src=e.target.src;document.getElementById('zoom').style.display='block'};
document.getElementById('zoom').onclick=()=>document.getElementById('zoom').style.display='none';
show();
</script></body></html>
